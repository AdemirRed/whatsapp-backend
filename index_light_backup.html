<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Session Manager - Professional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo .icon {
            font-size: 2.5rem;
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .api-status.online {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .api-status.offline {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .main-content {
            padding: 40px 0;
        }

        .controls-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .control-group {
            background: rgba(248, 249, 250, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(233, 236, 239, 0.5);
            transition: all 0.3s ease;
        }

        .control-group:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .control-group h3 {
            margin-bottom: 15px;
            color: #495057;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sessions-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .session-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(233, 236, 239, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .session-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .session-card.hibernated {
            background: linear-gradient(135deg, #fff8e1, #fff3c4);
            border-color: #ffc107;
        }

        .session-card.hibernated::before {
            background: linear-gradient(90deg, #ffc107, #ffb300);
        }

        .session-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #e9ecef;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .session-info h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .session-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .session-status.connected {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .session-status.hibernated {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        .session-status.disconnected {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .session-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .session-buttons .btn:last-child {
            grid-column: span 2;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #545b62);
            color: white;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-control {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .global-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-success {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: #155724;
        }

        .result-error {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #721c24;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 3% auto;
            padding: 0;
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px 30px;
            position: relative;
            flex-shrink: 0;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) rotate(90deg);
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .profile-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-info h3 {
            font-size: 1.4rem;
            color: #495057;
            margin-bottom: 5px;
        }

        .profile-info p {
            margin: 0;
            font-size: 1rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .info-item strong {
            color: #495057;
            font-weight: 600;
            flex-shrink: 0;
            min-width: 120px;
        }

        .info-item span {
            color: #6c757d;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            text-align: right;
            word-break: break-all;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            color: #6c757d;
            margin-top: 15px;
            font-size: 1rem;
        }

        /* Status indicators */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        .status-indicator.hibernated {
            background: #ffc107;
        }

        .status-indicator.disconnected {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .sessions-grid {
                grid-template-columns: 1fr;
            }

            .session-buttons {
                grid-template-columns: 1fr;
            }

            .session-buttons .btn:last-child {
                grid-column: span 1;
            }

            .modal-content {
                margin: 5% auto;
                width: 95%;
                max-height: 95vh;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .info-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .info-item span {
                text-align: left;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
        }

        /* Loading animations */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .slide-up {
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Dashboard stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #495057;
        }

        .stat-card .label {
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="icon">📱</span>
                    <h1>WhatsApp Session Manager</h1>
                </div>
                <div class="api-status" id="apiStatus">
                    <span class="status-indicator"></span>
                    Verificando...
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <!-- Stats Dashboard -->
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated here -->
            </div>

            <!-- Controls Section -->
            <div class="controls-section">
                <h2 class="section-title">🎛️ Controles do Sistema</h2>
                <div class="controls-grid">
                    <!-- Session Controls -->
                    <div class="control-group">
                        <h3>📝 Criar Nova Sessão</h3>
                        <div class="input-group">
                            <input type="text" id="sessionIdInput" class="form-control" placeholder="Digite o ID da sessão">
                            <button class="btn btn-primary" onclick="createSession()">
                                ➕ Criar
                            </button>
                        </div>
                    </div>

                    <!-- QR Code -->
                    <div class="control-group">
                        <h3>📲 Obter QR Code</h3>
                        <div class="input-group">
                            <input type="text" id="qrSessionIdInput" class="form-control" placeholder="ID da sessão para QR">
                            <button class="btn btn-info" onclick="getQRCodeManual()">
                                🔗 QR Code
                            </button>
                        </div>
                    </div>

                    <!-- Send Message -->
                    <div class="control-group">
                        <h3>💬 Enviar Mensagem</h3>
                        <div class="input-group">
                            <input type="text" id="messageSessionId" class="form-control" placeholder="ID da sessão">
                            <input type="text" id="messageNumber" class="form-control" placeholder="Número (ex: 5511999999999)">
                        </div>
                        <div class="input-group">
                            <input type="text" id="messageText" class="form-control" placeholder="Sua mensagem">
                            <button class="btn btn-success" onclick="sendMessage()">
                                📤 Enviar
                            </button>
                        </div>
                    </div>

                    <!-- Global Controls -->
                    <div class="control-group">
                        <h3>🌐 Controles Globais</h3>
                        <div class="global-controls">
                            <button class="btn btn-warning" onclick="hibernateAllSessions()">
                                😴 Hibernar Todas
                            </button>
                            <button class="btn btn-success" onclick="reactivateAllSessions()">
                                🔋 Reativar Todas
                            </button>
                            <button class="btn btn-danger" onclick="terminateInactive()">
                                🗑️ Limpar Inativas
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Result Box -->
                <div id="globalResult" class="result-box" style="display: none;"></div>
            </div>

            <!-- Sessions Section -->
            <div class="sessions-section">
                <div class="section-header">
                    <h2 class="section-title">📋 Sessões Ativas</h2>
                    <button class="btn btn-primary" onclick="loadSessions()">
                        🔄 Atualizar Lista
                    </button>
                </div>
                <div class="sessions-grid" id="sessionsContainer">
                    <!-- Sessions will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Informações da Sessão -->
    <div id="sessionInfoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2>📱 Informações da Sessão</h2>
            </div>
            <div class="modal-body">
                <!-- Loading -->
                <div id="modalLoading" style="text-align: center; padding: 20px;">
                    <div class="spinner"></div>
                    <p class="loading-text">Carregando informações...</p>
                </div>
                
                <!-- Conteúdo do Modal -->
                <div id="modalContent" style="display: none;">
                    <!-- Cabeçalho com foto e nome -->
                    <div class="profile-header">
                        <img id="modalProfileImg" src="" alt="Foto de Perfil" style="display: none;">
                        <div class="profile-info">
                            <h3 id="modalSessionTitle">Carregando...</h3>
                            <p id="modalSessionStatus">Verificando status...</p>
                        </div>
                    </div>
                    
                    <!-- Grid de informações -->
                    <div id="sessionInfoGrid" class="info-grid">
                        <!-- Informações serão preenchidas via JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:200';
        const API_KEY = 'redblack';
        let currentSessionForQR = null;

        // Função para fazer requisições à API
        async function apiRequest(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: {
                        'accept': 'application/json',
                        'x-api-key': API_KEY
                    }
                };

                if (body) {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const data = await response.json();

                return {
                    success: response.ok,
                    data: data,
                    error: response.ok ? null : (data.message || `HTTP ${response.status}`)
                };
            } catch (error) {
                return {
                    success: false,
                    data: null,
                    error: error.message
                };
            }
        }

        // Verificar status da API
        async function checkApiStatus() {
            const result = await apiRequest('/health');
            const statusElement = document.getElementById('apiStatus');
            
            if (result.success) {
                statusElement.className = 'api-status online';
                statusElement.innerHTML = '<span class="status-indicator connected"></span>API Online';
            } else {
                statusElement.className = 'api-status offline';
                statusElement.innerHTML = '<span class="status-indicator disconnected"></span>API Offline';
            }
        }

        // Atualizar estatísticas do dashboard
        async function updateStats() {
            const result = await apiRequest('/session/list');
            if (!result.success) return;

            const sessions = result.data;
            const connected = sessions.filter(s => s.status === 'CONNECTED').length;
            const hibernated = sessions.filter(s => s.status === 'HIBERNATED').length;
            const disconnected = sessions.filter(s => s.status === 'DISCONNECTED').length;
            const total = sessions.length;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="icon">📊</div>
                    <div class="number">${total}</div>
                    <div class="label">Total de Sessões</div>
                </div>
                <div class="stat-card">
                    <div class="icon">✅</div>
                    <div class="number">${connected}</div>
                    <div class="label">Conectadas</div>
                </div>
                <div class="stat-card">
                    <div class="icon">😴</div>
                    <div class="number">${hibernated}</div>
                    <div class="label">Hibernadas</div>
                </div>
                <div class="stat-card">
                    <div class="icon">❌</div>
                    <div class="number">${disconnected}</div>
                    <div class="label">Desconectadas</div>
                </div>
            `;
        }

        // Carregar lista de sessões
        async function loadSessions() {
            const result = await apiRequest('/session/list');
            const container = document.getElementById('sessionsContainer');
            
            if (!result.success) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #dc3545;">
                        <h3>❌ Erro ao carregar sessões</h3>
                        <p>${result.error}</p>
                    </div>
                `;
                return;
            }

            const sessions = result.data;
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #6c757d;">
                        <h3>📱 Nenhuma sessão encontrada</h3>
                        <p>Crie uma nova sessão para começar</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sessions.map(session => {
                const isConnected = session.status === 'CONNECTED';
                const isHibernated = session.status === 'HIBERNATED';
                const statusClass = isConnected ? 'connected' : (isHibernated ? 'hibernated' : 'disconnected');
                const statusText = isConnected ? 'Conectado' : (isHibernated ? 'Hibernada' : 'Desconectado');
                
                return `
                    <div class="session-card ${isHibernated ? 'hibernated' : ''} fade-in">
                        <div class="session-header">
                            ${session.profilePicUrl ? `
                                <img src="${session.profilePicUrl}" alt="Foto de Perfil" class="profile-pic">
                            ` : `
                                <div class="profile-pic" style="background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem;">
                                    👤
                                </div>
                            `}
                            <div class="session-info">
                                <h3>${session.name || session.sessionId}</h3>
                                <div class="session-status ${statusClass}">
                                    <span class="status-indicator ${statusClass}"></span>
                                    ${statusText}
                                </div>
                            </div>
                        </div>
                        
                        <div class="session-buttons">
                            ${isHibernated ? `
                                <button class="btn btn-success" onclick="reactivateSession('${session.sessionId}')">
                                    🔋 Reativar
                                </button>
                            ` : `
                                <button class="btn btn-primary" onclick="getQRCode('${session.sessionId}')" ${isConnected ? 'disabled' : ''}>
                                    📱 QR Code
                                </button>
                                <button class="btn btn-warning" onclick="hibernateSession('${session.sessionId}')">
                                    😴 Hibernar
                                </button>
                            `}
                            <button class="btn btn-info" onclick="showSessionInfo('${session.sessionId}')">
                                ℹ️ Info
                            </button>
                            <button class="btn btn-secondary" onclick="checkSessionStatus('${session.sessionId}')">
                                📊 Status
                            </button>
                            <button class="btn btn-danger" onclick="terminateSession('${session.sessionId}')">
                                🛑 Terminar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Atualizar estatísticas também
            updateStats();
        }

        // Criar nova sessão
        async function createSession() {
            const sessionId = document.getElementById('sessionIdInput').value.trim();
            if (!sessionId) {
                alert('Por favor, digite um ID para a sessão');
                return;
            }

            const result = await apiRequest('/session/create', 'POST', { sessionId });
            
            if (result.success) {
                alert('✅ Sessão criada com sucesso!');
                document.getElementById('sessionIdInput').value = '';
                loadSessions();
            } else {
                alert(`❌ Erro ao criar sessão: ${result.error}`);
            }
        }

        // Obter QR Code
        async function getQRCode(sessionId) {
            currentSessionForQR = sessionId;
            const result = await apiRequest(`/session/qr/${sessionId}`);
            
            if (result.success && result.data.qr) {
                // Criar modal para mostrar QR
                showQRModal(result.data.qr, sessionId);
            } else {
                alert(`❌ Erro ao obter QR Code: ${result.error || 'QR não disponível'}`);
            }
        }

        function showQRModal(qrCode, sessionId) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'block';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 400px; text-align: center;">
                    <div class="modal-header">
                        <span class="close" onclick="this.parentElement.parentElement.parentElement.remove()">&times;</span>
                        <h2>📱 QR Code - ${sessionId}</h2>
                    </div>
                    <div class="modal-body">
                        <p>Escaneie este QR Code com o WhatsApp:</p>
                        <img src="${qrCode}" alt="QR Code" style="width: 100%; max-width: 300px; border-radius: 10px;">
                        <p style="margin-top: 15px; color: #6c757d;">
                            Abra o WhatsApp > Dispositivos conectados > Conectar um dispositivo
                        </p>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Obter QR Code manual
        async function getQRCodeManual() {
            const sessionId = document.getElementById('qrSessionIdInput').value.trim();
            if (!sessionId) {
                alert('Por favor, digite o ID da sessão');
                return;
            }
            
            await getQRCode(sessionId);
            document.getElementById('qrSessionIdInput').value = '';
        }

        // Enviar mensagem
        async function sendMessage() {
            const sessionId = document.getElementById('messageSessionId').value.trim();
            const number = document.getElementById('messageNumber').value.trim();
            const message = document.getElementById('messageText').value.trim();
            
            if (!sessionId || !number || !message) {
                alert('Por favor, preencha todos os campos');
                return;
            }

            const result = await apiRequest('/message/send', 'POST', {
                sessionId,
                number,
                message
            });
            
            if (result.success) {
                alert('✅ Mensagem enviada com sucesso!');
                document.getElementById('messageSessionId').value = '';
                document.getElementById('messageNumber').value = '';
                document.getElementById('messageText').value = '';
            } else {
                alert(`❌ Erro ao enviar mensagem: ${result.error}`);
            }
        }

        // Verificar status da sessão
        async function checkSessionStatus(sessionId) {
            const result = await apiRequest(`/session/status/${sessionId}`);
            
            if (result.success) {
                alert(`📊 Status da sessão ${sessionId}:\n\n${JSON.stringify(result.data, null, 2)}`);
            } else {
                alert(`❌ Erro ao verificar status: ${result.error}`);
            }
        }

        // Terminar sessão
        async function terminateSession(sessionId) {
            if (!confirm(`⚠️ Tem certeza que deseja terminar a sessão "${sessionId}"?`)) {
                return;
            }

            const result = await apiRequest(`/session/terminate/${sessionId}`, 'DELETE');
            
            if (result.success) {
                alert('✅ Sessão terminada com sucesso!');
                loadSessions();
            } else {
                alert(`❌ Erro ao terminar sessão: ${result.error}`);
            }
        }

        // Hibernar sessão
        async function hibernateSession(sessionId) {
            try {
                const result = await apiRequest(`/session/hibernate/${sessionId}`, 'POST');
                
                if (result.success) {
                    alert(`✅ Sessão "${sessionId}" hibernada com sucesso!\n\nA sessão foi pausada mas mantém a conexão com o WhatsApp.`);
                    loadSessions();
                } else {
                    alert('❌ Erro ao hibernar sessão: ' + (result.error || (result.data && result.data.message) || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error('Erro ao hibernar sessão:', error);
                alert('❌ Erro ao hibernar sessão: ' + error.message);
            }
        }

        // Reativar sessão
        async function reactivateSession(sessionId) {
            try {
                const result = await apiRequest(`/session/reactivate/${sessionId}`, 'POST');
                
                if (result.success) {
                    alert(`✅ Sessão "${sessionId}" reativada com sucesso!\n\nA sessão voltou ao estado ativo.`);
                    loadSessions();
                } else {
                    alert('❌ Erro ao reativar sessão: ' + (result.error || (result.data && result.data.message) || 'Erro desconhecido'));
                }
            } catch (error) {
                console.error('Erro ao reativar sessão:', error);
                alert('❌ Erro ao reativar sessão: ' + error.message);
            }
        }

        // Hibernar todas as sessões
        async function hibernateAllSessions() {
            if (!confirm('⚠️ Tem certeza que deseja hibernar TODAS as sessões ativas?\n\nEsta ação é ideal para manutenção do sistema.')) {
                return;
            }

            const result = await apiRequest('/session/hibernateAll', 'POST');
            const resultDiv = document.getElementById('globalResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = `✅ ${result.data.hibernatedCount} sessões hibernadas com sucesso!\n\n` + JSON.stringify(result.data, null, 2);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `❌ Erro: ${result.error || 'Falha na requisição'}`;
            }
            
            loadSessions();
        }

        // Reativar todas as sessões hibernadas
        async function reactivateAllSessions() {
            if (!confirm('⚠️ Tem certeza que deseja reativar TODAS as sessões hibernadas?')) {
                return;
            }

            const result = await apiRequest('/session/reactivateAll', 'POST');
            const resultDiv = document.getElementById('globalResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = `✅ ${result.data.reactivatedCount} sessões reativadas com sucesso!\n\n` + JSON.stringify(result.data, null, 2);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `❌ Erro: ${result.error || 'Falha na requisição'}`;
            }
            
            loadSessions();
        }

        // Terminar sessões inativas
        async function terminateInactive() {
            if (!confirm('⚠️ Tem certeza que deseja terminar todas as sessões inativas?')) {
                return;
            }

            const result = await apiRequest('/session/terminateInactive', 'DELETE');
            const resultDiv = document.getElementById('globalResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = `✅ ${result.data.terminatedCount} sessões inativas terminadas!\n\n` + JSON.stringify(result.data, null, 2);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `❌ Erro: ${result.error || 'Falha na requisição'}`;
            }
            
            loadSessions();
        }

        // Função para exibir informações detalhadas da sessão
        async function showSessionInfo(sessionId) {
            try {
                const modal = document.getElementById('sessionInfoModal');
                const modalContent = document.getElementById('modalContent');
                const modalLoading = document.getElementById('modalLoading');
                
                // Verificar se os elementos existem
                if (!modal || !modalContent || !modalLoading) {
                    console.error('Elementos do modal não encontrados');
                    alert('❌ Erro: Modal não encontrado. Recarregue a página.');
                    return;
                }
                
                // Mostrar o modal
                modal.style.display = 'block';
                
                // Mostrar loading
                modalContent.style.display = 'none';
                modalLoading.style.display = 'block';
                
                // Buscar informações detalhadas da sessão
                const response = await fetch(`${API_BASE}/client/getClassInfo/${sessionId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Erro ao buscar informações: ${response.status}`);
                }
                
                const sessionInfo = await response.json();
                
                // Preencher o modal com as informações
                populateSessionModal(sessionId, sessionInfo);
                
                // Ocultar loading e mostrar conteúdo
                modalLoading.style.display = 'none';
                modalContent.style.display = 'block';
                
            } catch (error) {
                console.error('Erro ao buscar informações da sessão:', error);
                alert(`❌ Erro ao buscar informações da sessão: ${error.message}`);
                closeModal();
            }
        }
        
        // Função para preencher o modal com informações da sessão
        function populateSessionModal(sessionId, sessionInfo) {
            // Atualizar cabeçalho do modal
            const profileImg = document.getElementById('modalProfileImg');
            const sessionTitle = document.getElementById('modalSessionTitle');
            const sessionStatus = document.getElementById('modalSessionStatus');
            
            // Verificar se os elementos existem antes de manipulá-los
            if (!profileImg || !sessionTitle || !sessionStatus) {
                console.error('Elementos do modal não encontrados');
                return;
            }
            
            // Usar foto de perfil se disponível
            if (sessionInfo.profilePicUrl) {
                profileImg.src = sessionInfo.profilePicUrl;
                profileImg.style.display = 'block';
            } else {
                profileImg.style.display = 'none';
            }
            
            sessionTitle.textContent = sessionInfo.pushname || sessionInfo.wid?.user || sessionId;
            
            // Status da sessão
            const statusColor = sessionInfo.isConnected ? '#28a745' : '#dc3545';
            sessionStatus.innerHTML = `<span style="color: ${statusColor};">● ${sessionInfo.isConnected ? 'Conectado' : 'Desconectado'}</span>`;
            
            // Preencher informações detalhadas
            const infoGrid = document.getElementById('sessionInfoGrid');
            if (!infoGrid) {
                console.error('Grid de informações não encontrado');
                return;
            }
            
            infoGrid.innerHTML = `
                <div class="info-item">
                    <strong>Session ID:</strong>
                    <span>${sessionId}</span>
                </div>
                <div class="info-item">
                    <strong>Nome:</strong>
                    <span>${sessionInfo.pushname || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>WhatsApp ID:</strong>
                    <span>${sessionInfo.wid?.user || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Servidor:</strong>
                    <span>${sessionInfo.wid?.server || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Status:</strong>
                    <span style="color: ${statusColor};">${sessionInfo.isConnected ? 'Conectado' : 'Desconectado'}</span>
                </div>
                <div class="info-item">
                    <strong>Plataforma:</strong>
                    <span>${sessionInfo.platform || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Versão WA:</strong>
                    <span>${sessionInfo.wa_version || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Localização:</strong>
                    <span>${sessionInfo.locales || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Bateria:</strong>
                    <span>${sessionInfo.battery ? `${sessionInfo.battery}%` : 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Carregando:</strong>
                    <span>${sessionInfo.plugged !== undefined ? (sessionInfo.plugged ? 'Sim' : 'Não') : 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>Pode Receber Msg:</strong>
                    <span>${sessionInfo.canReceiveMessage !== undefined ? (sessionInfo.canReceiveMessage ? 'Sim' : 'Não') : 'N/A'}</span>
                </div>
                <div class="info-item">
                    <strong>É Business:</strong>
                    <span>${sessionInfo.isBusiness !== undefined ? (sessionInfo.isBusiness ? 'Sim' : 'Não') : 'N/A'}</span>
                </div>
            `;
        }
        
        // Função para fechar o modal
        function closeModal() {
            const modal = document.getElementById('sessionInfoModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Fechar modal ao clicar fora dele
        window.onclick = function(event) {
            const modal = document.getElementById('sessionInfoModal');
            if (modal && event.target === modal) {
                closeModal();
            }
        }

        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            checkApiStatus();
            loadSessions();
            
            // Verificar status da API a cada 30 segundos
            setInterval(checkApiStatus, 30000);
            
            // Atualizar lista de sessões a cada 10 segundos
            setInterval(loadSessions, 10000);
        });
    </script>
</body>
</html>
