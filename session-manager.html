<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Session Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 25px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #25D366;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #25D366;
        }

        .btn {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .btn-danger:hover {
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #333;
        }

        .btn-warning:hover {
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .session-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .session-card:hover {
            transform: translateY(-5px);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .session-id {
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-connected {
            background: #d4edda;
            color: #155724;
        }

        .status-disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .qr-code {
            text-align: center;
            margin: 20px 0;
        }

        .qr-code img {
            max-width: 200px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .api-status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .api-online {
            background: #d4edda;
            color: #155724;
        }

        .api-offline {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            float: right;
            font-size: 14px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 WhatsApp Session Manager</h1>
            <p>Gerencie suas sessões do WhatsApp de forma simples e eficiente</p>
        </div>

        <div class="main-content">
            <!-- Status da API -->
            <div id="apiStatus" class="api-status api-offline">
                🔴 Verificando status da API...
            </div>

            <!-- Seção de Criação de Nova Sessão -->
            <div class="section">
                <h2>📱 Criar Nova Sessão</h2>
                <div class="form-group">
                    <label for="newSessionId">ID da Sessão:</label>
                    <input type="text" id="newSessionId" placeholder="Digite o ID da nova sessão (ex: minha-sessao)" value="redblack">
                </div>
                <button class="btn" onclick="createSession()">Criar Sessão</button>
                <div id="createResult" class="result-box" style="display: none;"></div>
                
                <div id="qrCodeSection" style="display: none;">
                    <h3>QR Code para Conexão:</h3>
                    <div class="qr-code">
                        <div id="qrCodeImage"></div>
                        <button class="btn btn-warning" onclick="refreshQR()">🔄 Atualizar QR</button>
                    </div>
                </div>
            </div>

            <!-- Seção de Gerenciamento Global -->
            <div class="section">
                <h2>🔧 Gerenciamento Global</h2>
                <button class="btn btn-warning" onclick="terminateInactive()">⏸️ Terminar Inativas</button>
                <button class="btn btn-danger" onclick="terminateAll()">🛑 Terminar Todas</button>
                <button class="btn" onclick="loadSessions()">🔄 Recarregar Sessões</button>
                <div id="globalResult" class="result-box" style="display: none;"></div>
            </div>

            <!-- Seção de Sessões Ativas -->
            <div class="section">
                <h2>
                    📋 Sessões Ativas
                    <button class="btn refresh-btn" onclick="loadSessions()">🔄 Atualizar</button>
                </h2>
                <div class="loading" id="sessionsLoading">
                    <div class="spinner"></div>
                    <p>Carregando sessões...</p>
                </div>
                <div id="sessionsGrid" class="sessions-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:200';
        const API_KEY = 'redblack';
        let currentSessionForQR = null;

        // Função para fazer requisições à API
        async function apiRequest(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: {
                        'accept': 'application/json',
                        'x-api-key': API_KEY
                    }
                };

                if (body) {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Verificar status da API
        async function checkApiStatus() {
            const result = await apiRequest('/ping');
            const statusDiv = document.getElementById('apiStatus');
            
            if (result.success && result.data.success) {
                statusDiv.className = 'api-status api-online';
                statusDiv.innerHTML = '🟢 API Online - ' + result.data.message;
            } else {
                statusDiv.className = 'api-status api-offline';
                statusDiv.innerHTML = '🔴 API Offline';
            }
        }

        // Criar nova sessão
        async function createSession() {
            const sessionId = document.getElementById('newSessionId').value.trim();
            if (!sessionId) {
                alert('Por favor, digite um ID para a sessão');
                return;
            }

            const result = await apiRequest(`/session/start/${sessionId}`);
            const resultDiv = document.getElementById('createResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = JSON.stringify(result.data, null, 2);
                currentSessionForQR = sessionId;
                
                // Atualizar lista de sessões
                loadSessions();
                
                // Aguardar um pouco e então buscar o QR code
                setTimeout(() => {
                    getQRCode(sessionId);
                }, 2000);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `Erro: ${result.error || 'Falha na requisição'}`;
            }
        }

        // Obter QR Code
        async function getQRCode(sessionId) {
            if (!sessionId) sessionId = currentSessionForQR;
            if (!sessionId) return;

            const result = await apiRequest(`/session/qr/${sessionId}`);
            const qrSection = document.getElementById('qrCodeSection');
            const qrImageDiv = document.getElementById('qrCodeImage');
            
            if (result.success && result.data.qr) {
                // Gerar QR code usando API externa
                const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(result.data.qr)}`;
                qrImageDiv.innerHTML = `<img src="${qrCodeUrl}" alt="QR Code" />`;
                qrSection.style.display = 'block';
            } else {
                qrImageDiv.innerHTML = '<p>QR Code não disponível</p>';
                qrSection.style.display = 'block';
            }
        }

        // Atualizar QR Code
        function refreshQR() {
            if (currentSessionForQR) {
                getQRCode(currentSessionForQR);
            }
        }

        // Obter status da sessão
        async function getSessionStatus(sessionId) {
            const result = await apiRequest(`/session/status/${sessionId}`);
            if (result.success) {
                return result.data.state || 'UNKNOWN';
            }
            return 'ERROR';
        }

        // Verificar status de uma sessão específica (com alert)
        async function checkSessionStatus(sessionId) {
            const result = await apiRequest(`/session/status/${sessionId}`);
            if (result.success) {
                const status = result.data.state || 'UNKNOWN';
                const message = result.data.message || '';
                alert(`Sessão: ${sessionId}\nStatus: ${getStatusText(status)}\nMensagem: ${message}`);
            } else {
                alert(`Erro ao verificar status da sessão: ${sessionId}`);
            }
        }

        // Terminar sessão específica
        async function terminateSession(sessionId) {
            if (!confirm(`Tem certeza que deseja terminar a sessão "${sessionId}"?`)) {
                return;
            }

            const result = await apiRequest(`/session/terminate/${sessionId}`);
            if (result.success) {
                alert('Sessão terminada com sucesso!');
                loadSessions(); // Atualizar lista
            } else {
                alert('Erro ao terminar sessão: ' + (result.error || 'Erro desconhecido'));
            }
        }

        // Terminar sessões inativas
        async function terminateInactive() {
            if (!confirm('Tem certeza que deseja terminar todas as sessões inativas?')) {
                return;
            }

            const result = await apiRequest('/session/terminateInactive');
            const resultDiv = document.getElementById('globalResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = JSON.stringify(result.data, null, 2);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `Erro: ${result.error || 'Falha na requisição'}`;
            }
            
            loadSessions();
        }

        // Terminar todas as sessões
        async function terminateAll() {
            if (!confirm('Tem certeza que deseja terminar TODAS as sessões?')) {
                return;
            }

            const result = await apiRequest('/session/terminateAll');
            const resultDiv = document.getElementById('globalResult');
            
            resultDiv.style.display = 'block';
            
            if (result.success) {
                resultDiv.className = 'result-box result-success';
                resultDiv.textContent = JSON.stringify(result.data, null, 2);
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.textContent = `Erro: ${result.error || 'Falha na requisição'}`;
            }
            
            loadSessions();
        }

        // Carregar sessões reais do servidor
        async function loadSessions() {
            const loadingDiv = document.getElementById('sessionsLoading');
            const gridDiv = document.getElementById('sessionsGrid');
            
            loadingDiv.style.display = 'block';
            gridDiv.innerHTML = '';

            try {
                const result = await apiRequest('/session/list');
                
                loadingDiv.style.display = 'none';
                
                if (!result.success || !result.data.sessions) {
                    gridDiv.innerHTML = '<p style="text-align: center; color: #666;">Erro ao carregar sessões</p>';
                    return;
                }

                const sessions = result.data.sessions;
                
                if (sessions.length === 0) {
                    gridDiv.innerHTML = '<p style="text-align: center; color: #666;">Nenhuma sessão encontrada</p>';
                    return;
                }

                gridDiv.innerHTML = sessions.map(session => {
                    const statusClass = getStatusClass(session.status);
                    const statusText = getStatusText(session.status);
                    
                    return `
                        <div class="session-card">
                            <div class="session-header">
                                <div class="session-id">${session.sessionId}</div>
                                <div class="status-badge ${statusClass}">
                                    ${statusText}
                                </div>
                            </div>
                            <div style="margin-bottom: 10px;">
                                <small style="color: #666;"><strong>Status:</strong> ${session.message || 'N/A'}</small>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <button class="btn" onclick="getQRCode('${session.sessionId}')" ${session.status === 'CONNECTED' ? 'disabled' : ''}>📱 QR Code</button>
                                <button class="btn btn-warning" onclick="checkSessionStatus('${session.sessionId}')">📊 Status</button>
                                <button class="btn btn-danger" onclick="terminateSession('${session.sessionId}')">🛑 Terminar</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                loadingDiv.style.display = 'none';
                gridDiv.innerHTML = '<p style="text-align: center; color: #ff0000;">Erro ao carregar sessões: ' + error + '</p>';
            }
        }

        // Função para obter classe CSS do status
        function getStatusClass(status) {
            switch (status.toUpperCase()) {
                case 'CONNECTED':
                    return 'status-connected';
                case 'DISCONNECTED':
                case 'ERROR':
                    return 'status-disconnected';
                default:
                    return 'status-loading';
            }
        }

        // Função para obter texto do status em português
        function getStatusText(status) {
            switch (status.toUpperCase()) {
                case 'CONNECTED':
                    return 'CONECTADO';
                case 'DISCONNECTED':
                    return 'DESCONECTADO';
                case 'ERROR':
                    return 'ERRO';
                case 'OPENING':
                    return 'ABRINDO';
                case 'PAIRING':
                    return 'PAREANDO';
                case 'TIMEOUT':
                    return 'TIMEOUT';
                default:
                    return status;
            }
        }

        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            checkApiStatus();
            loadSessions();
            
            // Verificar status da API a cada 30 segundos
            setInterval(checkApiStatus, 30000);
            
            // Atualizar lista de sessões a cada 10 segundos
            setInterval(loadSessions, 10000);
        });
    </script>
</body>
</html>
