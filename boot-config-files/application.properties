# ==============================================
# CONFIGURAÇÃO SPRING BOOT - WHATSAPP MANAGER
# ==============================================

# Server configuration
server.port=4001
server.servlet.context-path=/

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/static/**

# CORS configuration
management.endpoints.web.cors.allowed-origins=http://localhost:201,http://localhost:4001
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.yourcompany.whatsapp=DEBUG

# WhatsApp Webhook Configuration
whatsapp.api.url=http://localhost:201
whatsapp.api.key=redblack
whatsapp.webhook.enabled=true

# JPA/Database configuration (se necessário)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.jpa.hibernate.ddl-auto=update
